name: changelog

on:
  pull_request:
    # The events that change no code live here and not in ci.yml: a label
    # opts the pull request in or out, and edited fires when a stacked pull
    # request is retargeted to a new base branch. edited also fires on title
    # and body edits, which cost seconds here.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The skip-changelog label opts a pull request out.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # The script reads the base branch through its remote-tracking ref,
          # so the checkout fetches every branch.
          fetch-depth: 0
      - name: Require a changelog entry under Unreleased
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: scripts/check-changelog.sh "origin/$BASE_REF"

  required:
    name: Changelog required
    needs: changelog
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the changelog check to pass
        # A skipped check means the skip-changelog label opted the pull
        # request out, so the aggregate stays green.
        env:
          CHANGELOG_RESULT: ${{ needs.changelog.result }}
        run: test "$CHANGELOG_RESULT" = success || test "$CHANGELOG_RESULT" = skipped
