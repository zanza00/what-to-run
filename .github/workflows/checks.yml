name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check Markdown formatting
        run: |
          go run scripts/install-dprint.go bin/tools/dprint
          bin/tools/dprint check
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -shuffle=on ./...

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          for os in linux darwin windows; do
            GOOS=$os GOARCH=amd64 go build -o /dev/null ./cmd/wtr
            GOOS=$os GOARCH=arm64 go build -o /dev/null ./cmd/wtr
          done
      - name: Vet for Windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: Test release publishers
        # Python is used only by the release publishers, not by the CLI.
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Test the npm launcher
        # The launcher is the only JavaScript the project ships: the npm
        # packages are a release channel, not a runtime dependency.
        run: node --test 'npm/test/*.test.js'
      - name: Test the setup scripts as root
        # The scripts refuse to run without root; the stub tools and the WTR_*
        # paths keep this run inside a temporary directory.
        run: sudo env "PATH=$PATH" python3 -m unittest discover -s scripts -p 'setup_scripts_test.py'

  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # ci.yml calls this workflow for pull requests and for pushes to main;
    # the job needs a pull request, because it reads the base branch and the
    # labels from the calling event. The skip-changelog label opts a pull
    # request out.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # The script reads the base branch through its remote-tracking ref,
          # so the checkout fetches every branch.
          fetch-depth: 0
      - name: Require a changelog entry under Unreleased
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: scripts/check-changelog.sh "origin/$BASE_REF"
