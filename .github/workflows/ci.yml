name: ci

on:
  push:
    branches: [main]
  pull_request:
    # The changelog workflow owns the events that change no code: edited,
    # labeled and unlabeled. ready_for_review starts the checks when a draft
    # pull request becomes ready.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Draft pull requests skip the checks. Agent sessions open pull requests
    # as drafts while the work is in progress, and the matrix would run on
    # every push to a branch that is not ready for review. The changelog
    # workflow still runs on drafts, because its rule costs seconds and
    # reports early.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    uses: ./.github/workflows/checks.yml

  required:
    name: CI required
    needs: checks
    # The draft gate can skip the checks job. The aggregate then skips too, so
    # a draft pull request carries no CI verdict. The changelog aggregate
    # works the other way: there a skip is a decision of the skip-changelog
    # label, and the aggregate reports it green.
    if: always() && needs.checks.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require all checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
