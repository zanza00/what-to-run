name: ci

on:
  push:
    branches: [main]
  pull_request:
    # edited, labeled and unlabeled change no code: the changelog workflow
    # owns them, so these events do not re-run the matrix.
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  required:
    name: CI required
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require all checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
