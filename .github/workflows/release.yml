name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate version and main ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main

  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml

  publish:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    # The npm smoke gate adds a registry, a publish and three installs.
    timeout-minutes: 20
    permissions:
      contents: write
      # npm trusted publishing: the runner's OIDC token authenticates the
      # publish and signs the provenance attestation, so no registry token is
      # stored as a secret.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          # npm 11.5 or later is what speaks trusted publishing; the version
          # bundled with the runner image can be older.
          node-version: '24'
      - name: Prepare release publishing
        id: credentials
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo 'Configure the HOMEBREW_TAP_TOKEN Actions secret before releasing.' >&2
            exit 1
          fi
          # AUR publishing is optional while its secret is unset (AUR
          # registration is closed): releases skip it with a warning.
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo 'AUR_SSH_KEY_FILE=' >> "$GITHUB_ENV"
            echo '::warning title=AUR publishing skipped::Set the AUR_SSH_PRIVATE_KEY secret to publish what-to-run-bin to the AUR.'
          else
            umask 077
            printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/aur_key"
            if ! ssh-keygen -y -f "$RUNNER_TEMP/aur_key" >/dev/null 2>&1; then
              echo 'AUR_SSH_PRIVATE_KEY is not a valid unencrypted SSH private key.' >&2
              exit 1
            fi
            echo "AUR_SSH_KEY_FILE=$RUNNER_TEMP/aur_key" >> "$GITHUB_ENV"
          fi
          # Package repository publishing is optional while its key is unset.
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo 'APT_GPG_KEY_FILE=' >> "$GITHUB_ENV"
            echo '::warning title=Package repositories skipped::Set the APT_GPG_PRIVATE_KEY secret to publish the apt and RPM repositories.'
          else
            umask 077
            printf '%s\n' "$APT_GPG_PRIVATE_KEY" > "$RUNNER_TEMP/apt_key"
            echo "APT_GPG_KEY_FILE=$RUNNER_TEMP/apt_key" >> "$GITHUB_ENV"
          fi
          # The scoop pipe has no "do nothing without a token" mode, so the
          # channel is skipped explicitly. An empty --skip is ignored.
          skips=""
          if [ -z "$SCOOP_BUCKET_TOKEN" ]; then
            skips="scoop"
            echo '::warning title=Scoop publishing skipped::Set the SCOOP_BUCKET_TOKEN secret to publish the manifest into zanza00/scoop-bucket.'
          fi
          echo "GORELEASER_SKIP=$skips" >> "$GITHUB_ENV"
          echo "scoop_enabled=$([ -n "$SCOOP_BUCKET_TOKEN" ] && echo true || echo false)" \
            >> "$GITHUB_OUTPUT"
          echo "npm_enabled=$([ "$NPM_PUBLISH" = "true" ] && echo true || echo false)" \
            >> "$GITHUB_OUTPUT"
          # npm publishing is opt-in: the channel is skipped, like the AUR,
          # until the packages are on the registry.
          if [ "$NPM_PUBLISH" != "true" ]; then
            echo '::warning title=npm publishing skipped::Set the NPM_PUBLISH repository variable to "true" to publish what-to-run to npm.'
          fi

      - name: Install repository tools
        # The publisher shells out to reprepro and createrepo_c, which the
        # runner image does not ship.
        run: sudo apt-get update && sudo apt-get install -y reprepro createrepo-c
      - name: Publish release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --skip=${{ env.GORELEASER_SKIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          APT_GPG_KEY_FILE: ${{ env.APT_GPG_KEY_FILE }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      - name: Smoke test the npm channel
        # The gate runs on every release, also while publishing is opt-in: it
        # proves the packages this release would publish, and a failure stops
        # the job before the publish step can reach npmjs.com.
        run: |
          npm install --global pnpm@10
          python3 scripts/smoke-npm.py --tag "$GITHUB_REF_NAME" --artifact dist/checksums.txt
      - name: Publish to npm
        # A step of its own rather than a GoReleaser publisher: trusted
        # publishing reads the runner's OIDC token, and a GoReleaser publisher
        # only receives the variables listed in .goreleaser.yaml.
        if: steps.credentials.outputs.npm_enabled == 'true'
        run: python3 scripts/publish-npm.py --tag "$GITHUB_REF_NAME" --artifact dist/checksums.txt
      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          expected="$(printf '%s\n' \
            checksums.txt \
            "what-to-run_${version}_darwin_amd64.tar.gz" \
            "what-to-run_${version}_darwin_arm64.tar.gz" \
            "what-to-run_${version}_linux_amd64.deb" \
            "what-to-run_${version}_linux_amd64.rpm" \
            "what-to-run_${version}_linux_amd64.tar.gz" \
            "what-to-run_${version}_linux_arm64.deb" \
            "what-to-run_${version}_linux_arm64.rpm" \
            "what-to-run_${version}_linux_arm64.tar.gz" \
            "what-to-run_${version}_windows_amd64.zip" \
            "what-to-run_${version}_windows_arm64.zip" | sort)"

          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq '(.isDraft == false) and (.isPrerelease == false)' \
            | grep -qx true

          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")

      - name: Verify Scoop bucket
        # Publishing is skipped when the token is unset, so there is nothing
        # to check in that case.
        if: steps.credentials.outputs.scoop_enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # The bucket push happens during the release, but the raw CDN can
          # serve the previous commit for a few seconds.
          tmp=$(mktemp -d)
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            -o "$tmp/what-to-run.json" \
            https://raw.githubusercontent.com/zanza00/scoop-bucket/main/bucket/what-to-run.json
          gh release download "$RELEASE_TAG" --pattern checksums.txt \
            --dir "$tmp" --clobber
          python3 scripts/check-scoop-manifest.py "$RELEASE_TAG" \
            "$tmp/what-to-run.json" "$tmp/checksums.txt"

      - name: Verify package repositories
        # Publishing is skipped when the GPG secret is unset, so there is
        # nothing to check in that case.
        if: env.APT_GPG_KEY_FILE != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for arch in amd64 arm64; do
            gh api "repos/$GITHUB_REPOSITORY/contents/dists/stable/main/binary-$arch/Packages?ref=gh-pages" \
              -H "Accept: application/vnd.github.raw" | grep -qx "Version: $version"
          done
          scripts/check-rpm-repository.sh "$RELEASE_TAG"
          for script in setup.deb.sh setup.rpm.sh; do
            gh api "repos/$GITHUB_REPOSITORY/contents/$script?ref=gh-pages" \
              -H "Accept: application/vnd.github.raw" | diff -u "scripts/$script" -
          done

  verify-npm:
    # The channel is skipped while the repository variable is unset, so there
    # is nothing to verify then. This job cannot read
    # steps.credentials.outputs.npm_enabled: that output belongs to the publish
    # job, so the variable is read again here.
    needs: publish
    if: vars.NPM_PUBLISH == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Windows is the interesting one: npm runs the launcher through the
        # shims it generates for .cmd and PowerShell.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install and run the published package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          # The registry is eventually consistent: a version that was just
          # published can answer 404 for a few seconds.
          ready=""
          for attempt in $(seq 10); do
            if npm view "what-to-run@$version" version >/dev/null 2>&1; then
              ready=yes
              break
            fi
            sleep 6
          done
          if [ -z "$ready" ]; then
            echo "what-to-run@$version is not on the registry after 60 seconds." >&2
            exit 1
          fi
          output=$(npx --yes "what-to-run@$version" --version)
          echo "$output"
          test "$output" = "wtr $version"
