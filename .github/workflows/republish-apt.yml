name: republish apt

# Recovery path for a release whose GitHub assets were published but whose apt
# step failed (for example on the gh-pages push): publishes an existing tag to
# the repository served from gh-pages without recreating the release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: republish-apt
  cancel-in-progress: false

jobs:
  apt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Validate tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft \
            --jq '.isDraft == false' | grep -qx true
      - name: Require apt credentials
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo 'Configure the APT_GPG_PRIVATE_KEY Actions secret before republishing.' >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" > "$RUNNER_TEMP/apt_key"
          echo "APT_GPG_KEY_FILE=$RUNNER_TEMP/apt_key" >> "$GITHUB_ENV"
      - name: Install apt repository tools
        run: sudo apt-get update && sudo apt-get install -y reprepro
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --dir dist --clobber \
            --pattern checksums.txt --pattern 'what-to-run_*_linux_*.deb'
      - name: Publish apt repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/publish-apt.py --tag "$RELEASE_TAG" --artifact dist/checksums.txt
      - name: Verify apt repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          gh api "repos/$GITHUB_REPOSITORY/contents/dists/stable/main/binary-amd64/Packages?ref=gh-pages" \
            --jq '.content' | base64 -d | grep -qx "Version: $version"
