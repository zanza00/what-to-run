version: 2

# Set explicitly: archive names and the publishers depend on it, so a
# checkout directory or remote with another name must not change them.
project_name: what-to-run

# The same main package is built twice, once per name, and every archive holds
# both binaries (the invoked name is what the picker shows).
builds:
  - id: wtr
    main: ./cmd/wtr
    binary: wtr
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
  - id: what-to-run
    main: ./cmd/wtr
    binary: what-to-run
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

# Windows gets them as zip, since .tar.gz is unfamiliar there; every other
# target keeps tar.gz. GoReleaser appends .exe to both binaries on Windows.
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# Debian packages for Ubuntu/Debian: `apt install ./what-to-run_*.deb` installs
# both binaries.
nfpms:
  - id: deb
    package_name: what-to-run
    vendor: zanza00
    homepage: https://github.com/zanza00/what-to-run
    maintainer: Simone Picciani <codefloe@simonepicciani.it>
    description: Task picker for the commands you can never remember in a repository
    license: MIT
    section: utils
    priority: optional
    formats: [deb]
    bindir: /usr/bin
    # Same shape as the archives, so every asset name follows one pattern.
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids: [wtr, what-to-run]

checksum:
  name_template: checksums.txt

publishers:
  - name: homebrew-tap
    checksum: true
    # The script publishes once for checksums.txt and ignores other artifacts.
    cmd: python3 scripts/publish-homebrew.py --tag {{ .Tag }} --artifact {{ .ArtifactPath }}
    env:
      - GH_TOKEN={{ .Env.HOMEBREW_TAP_TOKEN }}
  - name: aur
    checksum: true
    # The script publishes once for checksums.txt and ignores other artifacts.
    cmd: python3 scripts/publish-aur.py --tag {{ .Tag }} --artifact {{ .ArtifactPath }}
    env:
      - AUR_SSH_KEY_FILE={{ .Env.AUR_SSH_KEY_FILE }}
  - name: apt
    checksum: true
    # The script publishes once for checksums.txt and ignores other artifacts.
    # It needs a token to push the gh-pages branch: GoReleaser only passes the
    # env listed here to the publisher, so GITHUB_TOKEN must be forwarded
    # explicitly or the push goes out unauthenticated.
    cmd: python3 scripts/publish-apt.py --tag {{ .Tag }} --artifact {{ .ArtifactPath }}
    env:
      - APT_GPG_KEY_FILE={{ .Env.APT_GPG_KEY_FILE }}
      - GITHUB_TOKEN={{ .Env.GITHUB_TOKEN }}

# The release notes are the merged commits: a merge commit only carries the
# branch or pull request name, so it is dropped and the commits it brought in
# speak for themselves.
changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "
