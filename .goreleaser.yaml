version: 2

# Set explicitly: archive names and the publishers depend on it, so a
# checkout directory or remote with another name must not change them.
project_name: what-to-run

# One binary, invoked as wtr; the program reads its name from argv[0], so a
# renamed or symlinked copy shows that name in usage, messages and the picker.
builds:
  - id: wtr
    main: ./cmd/wtr
    binary: wtr
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

# Windows gets a zip, since .tar.gz is unfamiliar there; every other target
# keeps tar.gz. GoReleaser appends .exe to the binary on Windows.
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# Linux packages: .deb for Debian/Ubuntu and .rpm for Fedora/RHEL.
# `apt install ./what-to-run_*.deb` or `dnf install ./what-to-run_*.rpm`
# installs wtr.
nfpms:
  - id: linux
    package_name: what-to-run
    vendor: zanza00
    homepage: https://github.com/zanza00/what-to-run
    maintainer: Simone Picciani <codefloe@simonepicciani.it>
    description: Task picker for the commands you can never remember in a repository
    license: MIT
    section: utils
    priority: optional
    formats: [deb, rpm]
    bindir: /usr/bin
    # Same shape as the archives, so every asset name follows one pattern.
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids: [wtr]
    rpm:
      # The key that signs the apt repository also signs the RPM packages, so
      # the RPM repository can serve them with gpgcheck=1. Local snapshot
      # builds without the key produce unsigned packages.
      signature:
        # index keeps local snapshot builds working when the variable is
        # unset: nfpm only signs when the path is not empty.
        key_file: '{{ index .Env "APT_GPG_KEY_FILE" }}'

checksum:
  name_template: checksums.txt

# Windows installs through Scoop: the manifest goes into the personal bucket,
# which needs no review, so `scoop install zanza00/what-to-run` works as soon
# as the release is up. The bucket keeps the manifests in bucket/ because that
# is the directory `scoop bucket list` counts.
scoops:
  - name: what-to-run
    homepage: https://github.com/zanza00/what-to-run
    description: Task picker for the commands you can never remember in a repository
    license: MIT
    directory: bucket
    repository:
      owner: zanza00
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    # A local release of a pre-release tag (vX.Y.Z-rc1) does not reach the
    # bucket; the workflow rejects such tags before publishing.
    skip_upload: auto

# Windows also installs through WinGet. GoReleaser writes the manifest into a
# fork of microsoft/winget-pkgs and opens the update pull request; the first
# package (0.8.0) was opened by hand and the automation takes over from the
# next release.
winget:
  - name: wtr
    publisher: zanza00
    publisher_url: https://github.com/zanza00
    publisher_support_url: https://github.com/zanza00/what-to-run/issues
    package_identifier: zanza00.WhatToRun
    package_name: What to Run
    short_description: Task picker for the commands you can never remember in a repository
    description: |-
      Discovers the tasks a project declares in package.json, Makefile, Taskfile,
      justfile, Makefile.toml, Cargo aliases, devbox.json, composer.json, deno.json
      or mise.toml, and runs the one you pick from a filterable list. It works as a
      shell widget, so the command runs in the current prompt and stays in your
      shell history.
    license: MIT
    license_url: https://github.com/zanza00/what-to-run/blob/main/LICENSE
    homepage: https://github.com/zanza00/what-to-run
    author: Simone Picciani
    tags:
      - cli
      - developer-tools
      - task-runner
    release_notes_url: https://github.com/zanza00/what-to-run/releases/tag/{{ .Tag }}
    repository:
      owner: zanza00
      name: winget-pkgs
      branch: what-to-run-{{ .Version }}
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    # Pre-release tags stay out of winget-pkgs; the workflow already refuses
    # to publish them.
    skip_upload: auto

publishers:
  - name: homebrew-tap
    checksum: true
    # The script publishes once for checksums.txt and ignores other artifacts.
    cmd: python3 scripts/publish-homebrew.py --tag {{ .Tag }} --artifact {{ .ArtifactPath }}
    env:
      - GH_TOKEN={{ .Env.HOMEBREW_TAP_TOKEN }}
  - name: aur
    checksum: true
    # The script publishes once for checksums.txt and ignores other artifacts.
    cmd: python3 scripts/publish-aur.py --tag {{ .Tag }} --artifact {{ .ArtifactPath }}
    env:
      - AUR_SSH_KEY_FILE={{ .Env.AUR_SSH_KEY_FILE }}
  - name: packages
    checksum: true
    # The script publishes once for checksums.txt and ignores other artifacts.
    # It writes both the apt and the RPM repository to gh-pages. It needs a
    # token to push the branch: GoReleaser only passes the env listed here to
    # the publisher, so GITHUB_TOKEN must be forwarded explicitly or the push
    # goes out unauthenticated.
    cmd: python3 scripts/publish-repo.py --tag {{ .Tag }} --artifact {{ .ArtifactPath }}
    env:
      - APT_GPG_KEY_FILE={{ .Env.APT_GPG_KEY_FILE }}
      - GITHUB_TOKEN={{ .Env.GITHUB_TOKEN }}

# The release notes are the merged commits: a merge commit only carries the
# branch or pull request name, so it is dropped and the commits it brought in
# speak for themselves.
changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "
