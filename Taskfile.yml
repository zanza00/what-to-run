version: '3'

vars:
  BINARY_NAME: wtr
  GO: go
  CMD: ./cmd/wtr
  KEY:
    sh: echo "${KEY:-ctrl-o}"
  # Version shown by --version, injected with ldflags: a git describe string for
  # local builds, the release tag when GoReleaser builds the archives.
  VERSION:
    sh: echo "${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
  LDFLAGS: -X main.version={{.VERSION}}
  # Where `task install` puts the binaries (override: PREFIX=/usr/local/bin).
  PREFIX:
    sh: echo "${PREFIX:-$HOME/.local/bin}"
  # dprint is downloaded here on first use by `task fmt-md`; see
  # scripts/install-dprint.go.
  DPRINT_DIR: bin/tools
  DPRINT: '{{.DPRINT_DIR}}/dprint{{if eq OS "windows"}}.exe{{end}}'

tasks:
  default:
    desc: Show the available tasks
    silent: true
    cmds:
      - '"{{.TASK_EXE}}" --list'

  all:
    desc: Format (Go and Markdown), vet, test, and build
    # Sequential on purpose: deps run in parallel, and fmt rewrites the files
    # test and build read.
    cmds:
      - task: fmt
      - task: test
      - task: build

  build:
    desc: Build bin/wtr
    silent: true
    cmds:
      - '{{.GO}} build -ldflags "{{.LDFLAGS}}" -o bin/{{.BINARY_NAME}} {{.CMD}}'

  demo:
    desc: Regenerate the README demo GIF (requires vhs, gifski and ImageMagick)
    deps: [build]
    cmds:
      - docs/demo/make-demo.sh

  bind:
    desc: Build and print the zsh integration for eval (task bind KEY=combo)
    silent: true
    cmds:
      - task: build
      - bin/{{.BINARY_NAME}} init zsh --key {{.KEY}}

  bind-bash:
    desc: Build and print the bash integration for eval (task bind-bash KEY=combo)
    silent: true
    cmds:
      - task: build
      - bin/{{.BINARY_NAME}} init bash --key {{.KEY}}

  install:
    desc: Install wtr into PREFIX (default ~/.local/bin)
    deps: [build]
    cmds:
      - mkdir -p {{.PREFIX}}
      - install -m755 bin/{{.BINARY_NAME}} {{.PREFIX}}/{{.BINARY_NAME}}
      - cmd: |
          echo "Installed {{.BINARY_NAME}} into {{.PREFIX}}"
          case ":$PATH:" in
            *:{{.PREFIX}}:*) ;;
            *) echo "Note: {{.PREFIX}} is not in your PATH" ;;
          esac
        silent: true

  run:
    desc: Run the application without building a binary
    cmds:
      - '{{.GO}} run {{.CMD}}'

  test:
    desc: Run tests with the race detector and coverage
    cmds:
      - '{{.GO}} test -race -coverprofile=coverage.out ./...'

  test-npm:
    desc: Run the npm launcher tests (Node 24)
    cmds:
      - node --test 'npm/test/*.test.js'

  smoke-npm:
    desc: Smoke test the npm channel on a local registry (Node and pnpm)
    cmds:
      - python3 scripts/smoke-npm.py

  fmt:
    desc: Format Go and Markdown, and vet the code
    cmds:
      - '{{.GO}} fmt ./...'
      - '{{.GO}} vet ./...'
      - task: fmt-md

  install-dprint:
    desc: Download the pinned dprint binary into bin/tools
    silent: true
    cmds:
      - '{{.GO}} run scripts/install-dprint.go {{.DPRINT}}'

  fmt-md:
    desc: Format the Markdown files with dprint
    deps: [install-dprint]
    cmds:
      - '{{.DPRINT}} fmt'

  check-md:
    desc: Check the Markdown formatting with dprint
    deps: [install-dprint]
    cmds:
      - '{{.DPRINT}} check'

  lint:
    desc: Run golangci-lint (requires golangci-lint installed)
    cmds:
      - golangci-lint run ./...

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - '{{.GO}} mod tidy'

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ dist/ coverage.out coverage.html

  help:
    desc: Show the available tasks
    silent: true
    cmds:
      - '"{{.TASK_EXE}}" --list'
